[project]
name = "fastapi-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MinT", email = "tnm1042002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
fastapi-core = "fastapi_core:main"

[tool.fastapi]
entrypoint = "fastapi_core.main:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
